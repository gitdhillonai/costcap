name: CostCap receipt budget check
description: Check estimated spend in a local CostCap receipt ledger. Unknown spend fails closed.
inputs:
  receipts:
    description: Receipt JSONL file path relative to the workspace
    required: true
  cap:
    description: Maximum estimated USD across the selected receipt file
    required: true
  day-cap:
    description: Optional UTC day cap in estimated USD
    required: false
  month-cap:
    description: Optional UTC month cap in estimated USD
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
    - shell: bash
      env:
        COSTCAP_RECEIPTS: ${{ inputs.receipts }}
        COSTCAP_CAP: ${{ inputs.cap }}
        COSTCAP_DAY_CAP: ${{ inputs.day-cap }}
        COSTCAP_MONTH_CAP: ${{ inputs.month-cap }}
        COSTCAP_ACTION_PATH: ${{ github.action_path }}
      run: |
        args=(check --receipts "$COSTCAP_RECEIPTS" --cap "$COSTCAP_CAP")
        if [ -n "$COSTCAP_DAY_CAP" ]; then args+=(--day-cap "$COSTCAP_DAY_CAP"); fi
        if [ -n "$COSTCAP_MONTH_CAP" ]; then args+=(--month-cap "$COSTCAP_MONTH_CAP"); fi
        node "$COSTCAP_ACTION_PATH/src/cli.js" "${args[@]}"
