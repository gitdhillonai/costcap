name: dns
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ${{ vars.USE_HOSTED_RUNNER == 'true' && 'ubuntu-latest' || fromJSON(vars.SELF_HOSTED_RUNNER || '["self-hosted","persoon-build"]') }}
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: fail closed without a DNS credential
        env:
          COSTCAP_DNS_TOKEN: ${{ secrets.COSTCAP_DNS_TOKEN }}
        run: node scripts/dns-preflight.mjs
