name: dns
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: [self-hosted, persoon-build1]
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fail closed without a DNS credential
        env:
          COSTCAP_DNS_TOKEN: ${{ secrets.COSTCAP_DNS_TOKEN }}
        run: node scripts/dns-preflight.mjs
