name: publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: [self-hosted, persoon-build1]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/pack-check.mjs
      - name: fail closed without NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-preflight.mjs
