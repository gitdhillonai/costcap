name: publish
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ${{ vars.USE_HOSTED_RUNNER == 'true' && 'ubuntu-latest' || fromJSON(vars.SELF_HOSTED_RUNNER || '["self-hosted","persoon-build"]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/pack-check.mjs
      - name: fail closed without NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-preflight.mjs
