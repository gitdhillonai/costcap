name: billing-readback
# Read-only: runs the startup Stripe readback gate (GET requests only) with the production env secrets. No charges, no writes.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  readback:
    runs-on: [self-hosted, persoon-build1]
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci --omit=dev || true
      - name: Readback
        env:
          COSTCAP_STRIPE_SECRET_KEY: ${{ secrets.COSTCAP_STRIPE_SECRET_KEY }}
          COSTCAP_STRIPE_WEBHOOK_SECRET: ${{ secrets.COSTCAP_STRIPE_WEBHOOK_SECRET }}
          COSTCAP_STRIPE_ACCOUNT_ID: ${{ secrets.COSTCAP_STRIPE_ACCOUNT_ID }}
          COSTCAP_STRIPE_PRICE_ID: ${{ secrets.COSTCAP_STRIPE_PRICE_ID }}
        run: node scripts/billing-readback.mjs
