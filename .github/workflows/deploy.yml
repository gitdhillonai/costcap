name: deploy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: [self-hosted, persoon-build1]
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fail closed without production secrets
        env:
          COSTCAP_ORIGIN: ${{ secrets.COSTCAP_ORIGIN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          COSTCAP_EMAIL_FROM: ${{ secrets.COSTCAP_EMAIL_FROM }}
          COSTCAP_EMAIL_PROVIDER: brevo
        run: node scripts/deploy-preflight.mjs
      - name: render one replica
        env:
          COSTCAP_ORIGIN: ${{ secrets.COSTCAP_ORIGIN }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          COSTCAP_EMAIL_FROM: ${{ secrets.COSTCAP_EMAIL_FROM }}
          COMPOSE_DISABLE_ENV_FILE: "1"
        run: docker compose config
      - name: apply one replica
        env:
          COSTCAP_DEPLOY_HOST: ${{ secrets.COSTCAP_DEPLOY_HOST }}
          COSTCAP_DEPLOY_SSH_KEY: ${{ secrets.COSTCAP_DEPLOY_SSH_KEY }}
          COSTCAP_GIT_SHA: ${{ github.sha }}
        run: node scripts/deploy-apply.mjs
      - name: canary the applied origin
        if: success()
        env:
          COSTCAP_ORIGIN: ${{ secrets.COSTCAP_ORIGIN }}
          COSTCAP_EXPECT_SHA: ${{ github.sha }}
          COSTCAP_EXPECT_BILLING: ${{ vars.COSTCAP_EXPECT_BILLING || 'disabled' }}
        run: node scripts/canary.mjs "$COSTCAP_ORIGIN"
