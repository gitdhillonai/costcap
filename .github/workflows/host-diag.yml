name: host-diag
# Read-only host inspection over the existing deploy key (docker ps, traefik routers, health). No changes.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Inspect
        env:
          COSTCAP_DEPLOY_HOST: ${{ secrets.COSTCAP_DEPLOY_HOST }}
          COSTCAP_DEPLOY_SSH_KEY: ${{ secrets.COSTCAP_DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/id; printf '%s\n' "$COSTCAP_DEPLOY_SSH_KEY" > /tmp/id
          S="ssh -i /tmp/id -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20"
          [ -f infra/ssh/costcap-deploy.known_hosts ] && S="$S -o UserKnownHostsFile=$PWD/infra/ssh/costcap-deploy.known_hosts -o StrictHostKeyChecking=yes" || S="$S -o StrictHostKeyChecking=accept-new"
          $S "$COSTCAP_DEPLOY_HOST" '
            echo "== ulhel labels"; docker inspect ulhel33ckh6ukvvn2wo9kcms-211006418705 --format "{{json .Config.Labels}}" | tr "," "\n" | grep -E "traefik|coolify.(name|fqdn|resourceName)|coolify.applicationId" | cut -c1-400
            echo "== ulhel state"; docker inspect ulhel33ckh6ukvvn2wo9kcms-211006418705 --format "{{.Name}} {{.State.Status}} started={{.State.StartedAt}} restart={{.HostConfig.RestartPolicy.Name}}"
            echo "== any container w/ costcap.dev in traefik rule"; for c in $(docker ps -q); do docker inspect $c --format "{{.Name}} {{range \$k,\$v := .Config.Labels}}{{\$v}} {{end}}" | grep -i "costcap.dev" | cut -c1-300; done
            echo "== dynamic/default_redirect_503.yaml"; cat /data/coolify/proxy/dynamic/default_redirect_503.yaml | head -30
            echo "== www-permanent-redirects (costcap lines)"; grep -n -i costcap /data/coolify/proxy/dynamic/www-permanent-redirects.yaml | head
            echo "== traefik routers api"; curl -s localhost:8080/api/http/routers 2>/dev/null | head -c 100
          ' 2>&1 | sed -E 's/(KEY|SECRET|TOKEN|PASSWORD)=[^ ]+/\1=***/Ig'
          rm -f /tmp/id
