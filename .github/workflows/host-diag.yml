name: host-diag
# Read-only host inspection over the existing deploy key (docker ps, traefik routers, health). No changes.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diag:
    runs-on: [self-hosted, persoon-build1]
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Inspect
        env:
          COSTCAP_DEPLOY_HOST: ${{ secrets.COSTCAP_DEPLOY_HOST }}
          COSTCAP_DEPLOY_SSH_KEY: ${{ secrets.COSTCAP_DEPLOY_SSH_KEY }}
        run: |
          install -m 600 /dev/null /tmp/id; printf '%s\n' "$COSTCAP_DEPLOY_SSH_KEY" > /tmp/id
          S="ssh -i /tmp/id -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20"
          [ -f infra/ssh/costcap-deploy.known_hosts ] && S="$S -o UserKnownHostsFile=$PWD/infra/ssh/costcap-deploy.known_hosts -o StrictHostKeyChecking=yes" || S="$S -o StrictHostKeyChecking=accept-new"
          $S "$COSTCAP_DEPLOY_HOST" '
            echo "== containers mentioning 50search"
            for c in $(docker ps -q); do
              if docker inspect $c --format "{{.Name}} {{range \$k,\$v := .Config.Labels}}{{\$v}} {{end}} {{range .Config.Env}}{{.}} {{end}}" | grep -qi "50search"; then
                n=$(docker inspect $c --format "{{.Name}} {{.Config.Image}} {{.State.Status}}")
                echo "-- $n"
                docker inspect $c --format "{{range \$k,\$v := .Config.Labels}}{{\$k}}={{\$v}}{{println}}{{end}}" | grep -E "traefik.*rule|coolify.(resourceName|applicationId|name)" | cut -c1-200
                echo "env names (values hidden):"; docker inspect $c --format "{{range .Config.Env}}{{println .}}{{end}}" | cut -d= -f1 | grep -iE "SUPABASE|DATABASE|POSTGRES|NEXT_PUBLIC" | sort | tr "\n" " "; echo
                echo "supabase host (non-secret):"; docker inspect $c --format "{{range .Config.Env}}{{println .}}{{end}}" | grep -E "^NEXT_PUBLIC_SUPABASE_URL=" | sed -E "s#^[^=]*=https?://([^/]+).*#\1#"
                echo "db host (non-secret):"; docker inspect $c --format "{{range .Config.Env}}{{println .}}{{end}}" | grep -E "^(DATABASE_URL|SUPABASE_DB_URL|POSTGRES_URL)=" | sed -E "s#^([^=]*)=[a-z]+://[^@]*@([^/:?]+).*#\1 host=\2#"
              fi
            done
            echo "== coolify apps dir"; ls /data/coolify/applications 2>/dev/null | head -3
          ' 2>&1 | sed -E 's/(KEY|SECRET|TOKEN|PASSWORD)=[^ ]+/\1=***/Ig'
          rm -f /tmp/id
